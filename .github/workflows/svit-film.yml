# Збирає OFX-плагін Svit Film для Мака (Apple Silicon + Intel) і публікує архів у реліз svit-film-<версія>.
# Мак-машини GitHub часто стоять у черзі, тож збираємо на Linux компілятором Zig (він уміє робити Mach-O).
name: svit-film
on:
  push:
    branches: [main]
    paths: ["plugins/svit-film/ofx/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tools
        run: |
          pip install ziglang
          sudo apt-get update -qq && sudo apt-get install -y -qq llvm >/dev/null
          ls /usr/bin/llvm-lipo* /usr/bin/llvm-otool* 2>/dev/null || true
      - name: Build
        run: bash plugins/svit-film/ofx/build_cross.sh
      - name: Sign (ad-hoc)
        # Без підпису macOS на Apple Silicon не завантажує плагін, і DaVinci його не бачить.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh api "repos/indygreg/apple-platform-rs/releases?per_page=30" --jq '[.[]|select(.tag_name|startswith("apple-codesign/"))][0].tag_name')
          echo "rcodesign: $TAG"
          gh release download "$TAG" -R indygreg/apple-platform-rs -p '*x86_64-unknown-linux-musl.tar.gz' -O rc.tgz
          tar xzf rc.tgz && RC=$(find . -name rcodesign -type f | head -1) && chmod +x "$RC"
          "$RC" sign plugins/svit-film/ofx/build/SvitFilm.ofx.bundle
          "$RC" print-signature-info plugins/svit-film/ofx/build/SvitFilm.ofx.bundle/Contents/MacOS/SvitFilm.ofx | head -20
          rm -rf rc.tgz apple-codesign-*
      - name: Inspect
        run: |
          F=plugins/svit-film/ofx/build/SvitFilm.ofx.bundle/Contents/MacOS/SvitFilm.ofx
          file "$F"
          OT=$(ls /usr/bin/llvm-otool* | head -1); NM=$(ls /usr/bin/llvm-nm* | grep -v ld | head -1)
          for A in arm64 x86_64; do
            echo "== $A"; "$NM" --arch=$A -gU "$F" | grep -i ofx
            "$OT" -arch $A -l "$F" | grep -E "LC_CODE_SIGNATURE|LC_ID_DYLIB|minos|LC_BUILD_VERSION" -A2 | head -16
            "$OT" -arch $A -l "$F" | grep -q LC_CODE_SIGNATURE || { echo "::error::$A slice is not signed"; exit 1; }
            "$OT" -arch $A -L "$F"
          done
      - name: Installer (.pkg)
        # Звичайний macOS-інсталятор: подвійний клік → «Встановити». Bom робить mkbom з bomutils.
        run: |
          git clone -q --depth 1 https://github.com/hogliux/bomutils /tmp/bomutils && make -s -C /tmp/bomutils
          cd plugins/svit-film/ofx
          VER="$(tr -d '[:space:]' < VERSION)"
          python3 mkpkg.py build/SvitFilm.ofx.bundle "$VER" "Svit.Film.$VER.pkg" --mkbom /tmp/bomutils/build/bin/mkbom
      - name: Package
        run: |
          cd plugins/svit-film/ofx
          VER="$(tr -d '[:space:]' < VERSION)"
          mkdir -p "pkg/Svit Film"
          cp -R build/SvitFilm.ofx.bundle "pkg/Svit Film/"
          cp install/* "pkg/Svit Film/"
          chmod +x "pkg/Svit Film/"*.command
          (cd pkg && zip -qry "../Svit.Film.$VER.zip" "Svit Film")
          unzip -l "Svit.Film.$VER.zip"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd plugins/svit-film/ofx
          VER="$(tr -d '[:space:]' < VERSION)"
          TAG="svit-film-$VER"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --latest=false \
              --title "Svit Film $VER (плагін для DaVinci)" \
              --notes "Плагін плівки для DaVinci Resolve. Завантаж **Svit.Film.$VER.pkg**, двічі клікни і натисни «Встановити». Потім у DaVinci: Preferences → System → Video Plugins → галочка біля SvitFilm, і Effects → OpenFX → Svit → Svit Film. (Svit.Film.$VER.zip потрібен для кнопки оновлення в самому плагіні.)"
          fi
          gh release upload "$TAG" "Svit.Film.$VER.pkg" "Svit.Film.$VER.zip" --clobber
