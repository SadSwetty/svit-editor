    <!-- мітка -->
    <rect x="176" y="176" width="300" height="74" fill="#141414"/>
    <text x="326" y="229" text-anchor="middle" font-family="DejaVu Sans Mono, Menlo, monospace" font-weight="bold"
          font-size="46" letter-spacing="2" fill="#FBFAF6">SVIT/FILM</text>
  </g>

  <!-- контур картки -->
  <rect x="86" y="86" width="820" height="820" rx="160" fill="none" stroke="#141414" stroke-width="16"/>
